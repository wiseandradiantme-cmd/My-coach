<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Conversation Coach</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0f;color:#e8e8f0;font-family:'DM Sans','Segoe UI',sans-serif;min-height:100vh}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  @keyframes micRing{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.6);opacity:0}}
  @keyframes speakPulse{0%,100%{opacity:.6}50%{opacity:1}}
  textarea:focus{border-color:#7c6af5!important;outline:none}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-thumb{background:#2a2a3a;border-radius:2px}
  .app{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:0 16px;position:relative;overflow:hidden}
  .glow{position:fixed;top:-20%;left:50%;transform:translateX(-50%);width:600px;height:400px;border-radius:50%;background:radial-gradient(ellipse,rgba(124,106,245,.1) 0%,transparent 70%);pointer-events:none;z-index:0}
  .wrap{width:100%;max-width:760px;position:relative;z-index:1}
  .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(124,106,245,.08);border:1px solid rgba(124,106,245,.27);border-radius:20px;padding:4px 12px;font-size:11px;color:#7c6af5;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
  h1{font-size:clamp(28px,5vw,42px);font-weight:800;background:linear-gradient(135deg,#e8e8f0,#7878a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.02em;margin-bottom:8px}
  .subtitle{color:#7878a0;font-size:15px;margin-bottom:32px}
  .section-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#4a4a6a;margin-bottom:12px}
  .cat-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .cat-tab{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:700;transition:all .15s ease;font-family:inherit}
  .scenario-grid{display:grid;gap:10px;margin-bottom:24px}
  .scenario-card{background:#13131a;border:1.5px solid #2a2a3a;border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .15s ease;position:relative}
  .scenario-card:hover{border-color:#7878a0}
  .card-icon{font-size:20px;margin-bottom:6px}
  .card-label{font-size:13px;font-weight:700;color:#e8e8f0;margin-bottom:3px}
  .card-desc{font-size:11px;color:#7878a0;line-height:1.4;margin-bottom:8px}
  .card-who{font-size:10px;font-weight:700;letter-spacing:.06em}
  .style-row{display:flex;gap:8px;margin-bottom:28px}
  .style-chip{flex:1;padding:10px 12px;border-radius:10px;cursor:pointer;background:#13131a;border:1.5px solid #2a2a3a;text-align:center;transition:all .15s ease}
  .style-chip-label{font-size:12px;font-weight:700;color:#e8e8f0;margin-bottom:2px}
  .style-chip-desc{font-size:10px;color:#7878a0}
  .start-btn{width:100%;padding:16px;border-radius:12px;border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:40px;transition:opacity .15s}
  .chat-header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;border-bottom:1px solid #2a2a3a}
  .chat-icon{width:36px;height:36px;border-radius:10px;background:rgba(124,106,245,.08);border:1px solid rgba(124,106,245,.27);display:flex;align-items:center;justify-content:center;font-size:18px}
  .chat-title{font-size:15px;font-weight:700}
  .chat-style{font-size:11px;color:#7878a0}
  .header-btns{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .voice-btn{padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600;font-family:inherit;display:flex;align-items:center;gap:5px;transition:all .15s}
  .stop-btn{padding:6px 10px;border-radius:8px;border:1px solid rgba(248,113,113,.27);background:rgba(248,113,113,.08);color:#f87171;font-size:11px;cursor:pointer;font-weight:600;font-family:inherit}
  .reset-btn{padding:7px 14px;border-radius:8px;border:1px solid #2a2a3a;background:transparent;color:#7878a0;font-size:12px;cursor:pointer;font-weight:600;font-family:inherit}
  .messages{flex:1;overflow-y:auto;padding:20px 0;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 0}
  .your-turn-box{max-width:420px;text-align:center}
  .your-turn-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7c6af5;margin-bottom:8px;opacity:.8}
  .your-turn-text{font-size:14px;color:#e8e8f0;line-height:1.7;background:rgba(124,106,245,.08);border:1px solid rgba(124,106,245,.2);border-radius:12px;padding:14px 18px}
  .your-turn-hint{font-size:12px;color:#7878a0;margin-top:10px}
  .msg-row{display:flex;gap:8px;align-items:flex-end}
  .avatar{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .bubble{max-width:75%;padding:12px 16px;font-size:14px;line-height:1.6;white-space:pre-wrap}
  .coach-msg{display:flex;margin-bottom:4px}
  .coach-bubble{max-width:90%;padding:14px 18px;border-radius:12px;background:linear-gradient(135deg,rgba(74,222,128,.08),rgba(74,222,128,.04));border:1px solid rgba(74,222,128,.25);font-size:13px;line-height:1.7;color:#c8ffd4}
  .coach-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#4ade80;margin-bottom:6px;opacity:.8}
  .input-area{padding:16px 0 24px;border-top:1px solid #2a2a3a;flex-shrink:0}
  .listening-indicator{margin-bottom:8px;display:flex;align-items:center;gap:8px;color:#f87171;font-size:12px;font-weight:600}
  .mic-error{margin-bottom:8px;font-size:12px;color:#f87171;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:8px;padding:8px 12px}
  .input-row{display:flex;gap:8px;align-items:flex-end}
  .mic-btn{width:44px;height:44px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;position:relative;transition:all .2s ease}
  textarea.msg-input{flex:1;background:#13131a;border:1.5px solid #2a2a3a;border-radius:12px;padding:12px 16px;color:#e8e8f0;font-size:14px;line-height:1.5;resize:none;font-family:inherit;min-height:48px;max-height:140px;transition:border-color .15s ease}
  .send-btn{width:44px;height:44px;border-radius:10px;border:none;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:all .15s ease;cursor:pointer}
  .apikey-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;max-width:440px;margin:0 auto;padding:24px}
  .apikey-wrap h2{font-size:22px;font-weight:800;text-align:center}
  .apikey-wrap p{font-size:13px;color:#7878a0;text-align:center;line-height:1.6}
  .apikey-wrap a{color:#7c6af5}
  .api-input{width:100%;background:#13131a;border:1.5px solid #2a2a3a;border-radius:12px;padding:12px 16px;color:#e8e8f0;font-size:14px;font-family:inherit}
  .api-input:focus{border-color:#7c6af5;outline:none}
  .api-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#7c6af5,#a78bfa);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect,useCallback}=React;

const CATEGORIES=[
{id:“work”,label:“Work”,icon:“💼”,color:”#6a9af5”,colorSoft:“rgba(106,154,245,0.08)”,scenarios:[
{id:“boss”,label:“Pitch to Boss”,icon:“📊”,aiStarts:false,yourTurn:“You requested this meeting — open with your pitch.”,description:“Present an idea or proposal to your manager”,systemPrompt:`You are playing the role of a busy, direct manager. The user is practicing pitching an idea to you. Respond naturally as a skeptical but fair boss — ask clarifying questions, push back on weak points, respond positively to clear structured communication. Keep responses concise (2-4 sentences). After 4-6 exchanges, break character and give a coaching debrief on their clarity and structure.`},
{id:“conflict”,label:“Workplace Conflict”,icon:“⚡”,aiStarts:true,opening:`Hey, do you have a minute? I've been feeling a bit sidelined lately and wanted to talk about it.`,description:“Navigate tension with a frustrated colleague”,systemPrompt:`You are playing the role of a colleague who feels overlooked or frustrated. Show mild defensiveness, need for acknowledgment, and gradually open up if the user communicates empathetically. Keep responses concise. After 4-6 exchanges, break character and give a coaching debrief on their clarity, empathy, and structure.`},
{id:“feedback”,label:“Give Feedback”,icon:“🗣️”,aiStarts:false,yourTurn:“You’ve asked for this meeting — open by setting the tone and raising the feedback.”,description:“Deliver constructive feedback to a team member”,systemPrompt:`You are playing the role of a team member receiving feedback. Start slightly defensive, then open up if the feedback is delivered clearly and kindly. After 4-6 exchanges, break character and give a coaching debrief on how structured, empathetic, and specific their feedback was.`},
{id:“meeting”,label:“Lead a Meeting”,icon:“🗓️”,aiStarts:true,opening:`Okay, I think everyone's here. Are we getting started?`,description:“Facilitate a team discussion and drive decisions”,systemPrompt:`You are playing the role of a team member in a meeting — engaged but sometimes going off-topic. The user is practicing facilitating and driving toward a decision. After 4-6 exchanges, break character and give a coaching debrief on their clarity, direction, and ability to manage the room.`},
]},
{id:“social”,label:“Social”,icon:“🌐”,color:”#f56a9a”,colorSoft:“rgba(245,106,154,0.08)”,scenarios:[
{id:“network”,label:“Networking Event”,icon:“🤝”,aiStarts:false,yourTurn:“You spotted someone interesting — walk over and introduce yourself.”,description:“Meet someone new at a professional event”,systemPrompt:`You are playing the role of a professional at a networking event — friendly but slightly guarded. Ask follow-up questions when they say something interesting, give short answers to generic questions. After 4-6 exchanges, break character and give a coaching debrief on their communication style and how engaging they were.`},
{id:“smalltalk”,label:“Small Talk”,icon:“☕”,aiStarts:true,opening:`Oh hey, I keep seeing you around here. You live nearby?`,description:“Keep a casual conversation flowing naturally”,systemPrompt:`You are playing the role of someone the user just met casually. Be warm but let silences develop if the user doesn't keep things moving. After 4-6 exchanges, break character and give a coaching debrief on their warmth, listening, and conversational flow.`},
{id:“meeting_people”,label:“Meeting People”,icon:“👋”,aiStarts:false,yourTurn:“You’re at an event and want to meet someone new — introduce yourself.”,description:“Introduce yourself and make a great first impression”,systemPrompt:`You are playing the role of a stranger the user is meeting for the first time. Be friendly but realistic — warm up if they show genuine interest. After 4-6 exchanges, break character and give a coaching debrief on their first impression, warmth, and how naturally they built rapport.`},
{id:“party”,label:“Party / Social Event”,icon:“🎉”,aiStarts:true,opening:`*glances over* Oh sorry, am I hogging the drinks table? Ha. I'm Alex, by the way.`,description:“Work a room and keep conversations alive”,systemPrompt:`You are playing the role of a guest at a social party — relaxed, open to good conversation. If they're awkward or generic, naturally drift; if they're fun and engaging, lean in. After 4-6 exchanges, break character and give a coaching debrief on their energy, hooks, and social ease.`},
{id:“persuade”,label:“Persuade Someone”,icon:“💡”,aiStarts:false,yourTurn:“You want to change their mind — make your opening case clearly and directly.”,description:“Win someone over to your point of view”,systemPrompt:`You are playing the role of someone skeptical of the user's idea. Push back thoughtfully, ask for evidence, only come around if the user makes a genuinely compelling case. After 4-6 exchanges, break character and give a coaching debrief on their persuasion technique, clarity, and use of logic vs. emotion.`},
{id:“apologize”,label:“Apologize Well”,icon:“🙏”,aiStarts:true,opening:`I've been waiting for you to reach out. I'm not sure what to say right now, honestly.`,description:“Make a genuine, clear apology after a mistake”,systemPrompt:`You are playing the role of someone who was hurt or let down. Show you need genuine acknowledgment, not just a quick sorry. Gradually accept the apology only if sincere and specific. After 4-6 exchanges, break character and give a coaching debrief on how genuine, clear, and accountable their apology was.`},
]},
{id:“performance”,label:“Performance”,icon:“🎯”,color:”#f5a96a”,colorSoft:“rgba(245,169,106,0.08)”,scenarios:[
{id:“presentation”,label:“Public Speaking”,icon:“🎤”,aiStarts:true,opening:`Alright, the room's ready. Whenever you're ready to begin.`,description:“Deliver a clear, confident presentation”,systemPrompt:`You are playing the role of an audience member. React realistically — confused when things are unclear, engaged when interesting, ask questions that expose weak structure. After 4-6 exchanges, break character and give a coaching debrief on their delivery, structure, and clarity.`},
{id:“interview”,label:“Job Interview”,icon:“📋”,aiStarts:true,opening:`Great to meet you. So — tell me a bit about yourself and why you're interested in this role.`,description:“Answer tough questions with clarity and confidence”,systemPrompt:`You are playing the role of a professional interviewer. Ask probing interview questions, follow up on vague answers, reward structured specific responses. After 4-6 exchanges, break character and give a coaching debrief on their answer structure, confidence, and clarity.`},
{id:“explain”,label:“Explain Complexity”,icon:“🔍”,aiStarts:false,yourTurn:“Pick something complex you know well — explain it to me like I have no background in it.”,description:“Break down a complex topic to a non-expert”,systemPrompt:`You are playing the role of a curious non-expert. Ask genuine questions when things are unclear, respond with delight when something clicks. After 4-6 exchanges, break character and give a coaching debrief on how well they simplified and structured their explanation.`},
{id:“negotiate”,label:“Negotiate”,icon:“⚖️”,aiStarts:true,opening:`So, you wanted to talk about your compensation. What's on your mind?`,description:“Push for what you want while keeping rapport”,systemPrompt:`You are playing the role of someone the user is negotiating with. Be firm but reasonable. Only move if the user makes a structured confident case. After 4-6 exchanges, break character and give a coaching debrief on their assertiveness, clarity, and negotiation structure.`},
]},
{id:“family”,label:“Family”,icon:“🏠”,color:”#6af5c8”,colorSoft:“rgba(106,245,200,0.08)”,scenarios:[
{id:“hardtalk”,label:“Hard Conversation”,icon:“💬”,aiStarts:false,yourTurn:“You’ve been putting this off — now’s the moment. Bring it up.”,description:“Raise a sensitive topic with a family member”,systemPrompt:`You are playing the role of a family member who is resistant or emotional. Show defensiveness or vulnerability. Gradually open up if approached with warmth and clarity. After 4-6 exchanges, break character and give a coaching debrief on their empathy, directness, and how they handled emotion.`},
{id:“boundary”,label:“Set a Boundary”,icon:“🚧”,aiStarts:true,opening:`Hey, I was thinking — it'd be great if you could come over again this weekend, like last time. Same plan?`,description:“Communicate a personal limit clearly and kindly”,systemPrompt:`You are playing the role of a family member who tends to push boundaries. Push back gently and only accept the boundary if stated clearly and firmly. After 4-6 exchanges, break character and give a coaching debrief on their clarity, firmness, and tone.`},
{id:“support”,label:“Offer Support”,icon:“❤️”,aiStarts:true,opening:`I don't even know where to start. Everything just feels like too much right now.`,description:“Be present and helpful when someone is struggling”,systemPrompt:`You are playing the role of a family member going through something hard. You need to feel heard more than fixed. Pull back if the user jumps to advice too quickly. After 4-6 exchanges, break character and give a coaching debrief on how well they listened, empathized, and supported without over-directing.`},
{id:“disagree”,label:“Disagree Respectfully”,icon:“🔄”,aiStarts:false,yourTurn:“You disagree with them on something real — bring it up and make your case.”,description:“Hold your ground without damaging the relationship”,systemPrompt:`You are playing the role of a family member who holds a strong opposing view. Show conviction but openness to dialogue if approached respectfully. After 4-6 exchanges, break character and give a coaching debrief on how well they expressed disagreement while maintaining warmth.`},
]},
];

const COACHING_STYLES=[
{id:“interrupt”,label:“Interrupt Me”,description:“Stop me when I lose clarity”},
{id:“after”,label:“Feedback After”,description:“Let me finish, then coach”},
{id:“natural”,label:“Play It Straight”,description:“Stay in role, debrief at end”},
];

const C={bg:”#0a0a0f”,surface:”#13131a”,border:”#2a2a3a”,accent:”#7c6af5”,accentGlow:“rgba(124,106,245,0.15)”,accentSoft:“rgba(124,106,245,0.08)”,text:”#e8e8f0”,textMuted:”#7878a0”,textDim:”#4a4a6a”,success:”#4ade80”,danger:”#f87171”};

function isCoachMsg(text){return[“coaching debrief”,“break character”,“as your coach”,”[coach]”,“coach feedback”,“debrief:”].some(k=>text.toLowerCase().includes(k));}

function TypingIndicator(){return(<div className="msg-row"><div className=“avatar” style={{background:C.surface,border:`1px solid ${C.border}`,color:C.textMuted}}>AI</div><div className=“bubble” style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:“16px 16px 16px 4px”}}><span style={{display:“flex”,gap:4,alignItems:“center”,height:16}}>{[0,1,2].map(i=><span key={i} style={{width:6,height:6,borderRadius:“50%”,background:C.textDim,display:“inline-block”,animation:`pulse 1.2s ease-in-out ${i*0.2}s infinite`}}/>)}</span></div></div>);}

function App(){
const saveKey=(k)=>{try{localStorage.setItem(“coach_api_key”,k);sessionStorage.setItem(“coach_api_key”,k);document.cookie=“coach_api_key=”+encodeURIComponent(k)+”;max-age=31536000;path=/”;}catch(e){}};
const loadKey=()=>{try{return localStorage.getItem(“coach_api_key”)||sessionStorage.getItem(“coach_api_key”)||decodeURIComponent((document.cookie.match(/coach_api_key=([^;]+)/)||[””,””])[1])||””;}catch(e){return “”;}};
const clearKey=()=>{try{localStorage.removeItem(“coach_api_key”);sessionStorage.removeItem(“coach_api_key”);document.cookie=“coach_api_key=;max-age=0;path=/”;}catch(e){}};

const [apiKey,setApiKey]=useState(()=>loadKey());
const [keyInput,setKeyInput]=useState(””);
const [screen,setScreen]=useState(()=>loadKey()?“setup”:“apikey”);
const [activeCategory,setActiveCategory]=useState(“work”);
const [scenario,setScenario]=useState(null);
const [coachStyle,setCoachStyle]=useState(null);
const [messages,setMessages]=useState([]);
const [input,setInput]=useState(””);
const [loading,setLoading]=useState(false);
const [listening,setListening]=useState(false);
const [voiceEnabled,setVoiceEnabled]=useState(true);
const [speaking,setSpeaking]=useState(false);
const [micError,setMicError]=useState(””);
const [voiceSupported]=useState(()=>“webkitSpeechRecognition” in window||“SpeechRecognition” in window);
const [ttsSupported]=useState(()=>“speechSynthesis” in window);

const messagesEndRef=useRef(null);
const textareaRef=useRef(null);
const recognitionRef=useRef(null);
const synthRef=useRef(window.speechSynthesis);

useEffect(()=>{messagesEndRef.current?.scrollIntoView({behavior:“smooth”})},[messages,loading]);
useEffect(()=>()=>{recognitionRef.current?.stop();synthRef.current?.cancel();},[]);

const allScenarios=CATEGORIES.flatMap(c=>c.scenarios);
const selectedScenario=allScenarios.find(s=>s.id===scenario);
const selectedStyle=COACHING_STYLES.find(s=>s.id===coachStyle);
const currentCategory=CATEGORIES.find(c=>c.id===activeCategory);

function buildSystemPrompt(){
const base=selectedScenario?.systemPrompt||””;
const note=coachStyle===“interrupt”?” IMPORTANT: If the user’s message lacks clarity, interrupt with a quick coaching tip before continuing.”
:coachStyle===“after”?” After each user message give a short in-role response followed by a [Coach] note on their clarity.”
:” Stay fully in role until the end, then give a debrief.”;
return base+note;
}

const speakText=useCallback((text)=>{
if(!ttsSupported||!voiceEnabled)return;
synthRef.current.cancel();
const clean=text.replace(/**|__|~~|[Coach]/gi,””).trim();
const utter=new SpeechSynthesisUtterance(clean);
utter.rate=1.0;utter.pitch=1.0;utter.volume=1.0;
const voices=synthRef.current.getVoices();
const preferred=voices.find(v=>v.lang.startsWith(“en”)&&v.name.includes(“Natural”))||voices.find(v=>v.lang.startsWith(“en”)&&!v.name.includes(“Google”))||voices.find(v=>v.lang.startsWith(“en”));
if(preferred)utter.voice=preferred;
utter.onstart=()=>setSpeaking(true);
utter.onend=()=>setSpeaking(false);
utter.onerror=()=>setSpeaking(false);
synthRef.current.speak(utter);
},[ttsSupported,voiceEnabled]);

const stopSpeaking=()=>{synthRef.current?.cancel();setSpeaking(false);};

async function sendMessage(text){
const content=(text||input).trim();
if(!content||loading)return;
stopSpeaking();
const userMsg={role:“user”,content};
const newMessages=[…messages,userMsg];
setMessages(newMessages);
setInput(””);
if(textareaRef.current)textareaRef.current.style.height=“auto”;
setLoading(true);
try{
let apiMessages=newMessages;
if(apiMessages[0]?.role===“assistant”){
apiMessages=[{role:“user”,content:”[Scene begins]”},…apiMessages];
}
const res=await fetch(“https://api.anthropic.com/v1/messages”,{
method:“POST”,
headers:{“Content-Type”:“application/json”,“x-api-key”:apiKey,“anthropic-version”:“2023-06-01”},
body:JSON.stringify({model:“claude-sonnet-4-20250514”,max_tokens:1000,system:buildSystemPrompt(),messages:apiMessages}),
});
if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e?.error?.message||`HTTP ${res.status}`);}
const data=await res.json();
const reply=data.content?.map(b=>b.text||””).join(””)||“Something went wrong.”;
setMessages(prev=>[…prev,{role:“assistant”,content:reply}]);
speakText(reply);
}catch(e){
setMessages(prev=>[…prev,{role:“assistant”,content:`⚠️ ${e.message}`}]);
}
setLoading(false);
}

function toggleListening(){
setMicError(””);
if(listening){recognitionRef.current?.stop();setListening(false);return;}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){setMicError(“Speech recognition not supported. Use Chrome or Safari.”);return;}
stopSpeaking();
try{
const rec=new SR();
recognitionRef.current=rec;
rec.lang=“en-US”;rec.continuous=false;rec.interimResults=true;
rec.onstart=()=>{setListening(true);setMicError(””);};
rec.onresult=(e)=>{
const t=Array.from(e.results).map(r=>r[0].transcript).join(””);
setInput(t);
if(e.results[e.results.length-1].isFinal){rec.stop();setListening(false);setTimeout(()=>sendMessage(t),200);}
};
rec.onerror=(e)=>{
setListening(false);
if(e.error===“not-allowed”)setMicError(“Mic blocked. Go to iPad Settings → Safari → Microphone → Allow.”);
else if(e.error===“no-speech”)setMicError(“No speech detected. Tap mic and try again.”);
else setMicError(`Mic error: ${e.error}`);
};
rec.onend=()=>setListening(false);
rec.start();
}catch(e){setMicError(“Could not start mic: “+e.message);}
}

function handleKeyDown(e){if(e.key===“Enter”&&!e.shiftKey){e.preventDefault();sendMessage();}}

async function startSession(){
if(!scenario||!coachStyle)return;
setMessages([]);setScreen(“chat”);
const s=allScenarios.find(x=>x.id===scenario);
if(s?.aiStarts&&s?.opening){
setTimeout(()=>{const msg={role:“assistant”,content:s.opening};setMessages([msg]);speakText(s.opening);},300);
}
}

function reset(){stopSpeaking();recognitionRef.current?.stop();setScreen(“setup”);setMessages([]);setInput(””);setListening(false);}

if(screen===“apikey”)return(
<div className="apikey-wrap">
<div style={{fontSize:40}}>🎙️</div>
<h2>My Conversation Coach</h2>
<p>Enter your Anthropic API key. It’s saved locally on your device and only used to call the Anthropic API.</p>
<p>Get a key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a></p>
<input className=“api-input” type=“password” placeholder=“sk-ant-…” value={keyInput} onChange={e=>setKeyInput(e.target.value)}
onKeyDown={e=>{if(e.key===“Enter”){const t=keyInput.trim();if(t.startsWith(“sk-ant-”)){saveKey(t);setApiKey(t);setScreen(“setup”);}}}}
/>
<button className=“api-btn” onClick={()=>{
const t=keyInput.trim();
if(t.startsWith(“sk-ant-”)){saveKey(t);setApiKey(t);setScreen(“setup”);}
else alert(“Please enter a valid key starting with sk-ant-”);
}}>Save & Continue →</button>
<p style={{fontSize:11,color:”#4a4a6a”}}>Key saved locally, never shared with anyone.</p>
<button style={{background:“transparent”,border:“none”,color:”#f87171”,fontSize:12,cursor:“pointer”,textDecoration:“underline”}}
onClick={()=>{clearKey();setKeyInput(””);}}>Clear saved key</button>
</div>
);

if(screen===“setup”)return(
<div className="app">
<div className="glow"/>
<div className="wrap" style={{paddingTop:32}}>
<div style={{textAlign:“center”,marginBottom:32}}>
<div className="badge">✦ My Conversation Coach</div>
<h1>Practice Real Conversations</h1>
<p className="subtitle">Choose a category, pick a scenario, then start your session</p>
</div>
<div className="section-label">Choose a category</div>
<div className="cat-tabs">
{CATEGORIES.map(cat=>{const active=activeCategory===cat.id;return(
<button key={cat.id} className=“cat-tab” onClick={()=>{setActiveCategory(cat.id);setScenario(null);}}
style={{background:active?cat.colorSoft:”#13131a”,border:`1.5px solid ${active?cat.color:"#2a2a3a"}`,color:active?cat.color:”#7878a0”}}>
{cat.icon} {cat.label}
</button>
);})}
</div>
<div className="section-label">Choose a scenario</div>
<div className=“scenario-grid” style={{gridTemplateColumns:`repeat(${currentCategory?.scenarios.length>4?3:2},1fr)`}}>
{currentCategory?.scenarios.map(s=>{const sel=scenario===s.id;return(
<div key={s.id} className=“scenario-card” onClick={()=>setScenario(s.id)}
style={{background:sel?currentCategory.colorSoft:”#13131a”,border:`1.5px solid ${sel?currentCategory.color:"#2a2a3a"}`,boxShadow:sel?`0 0 20px ${currentCategory.colorSoft}`:“none”}}>
<div className="card-icon">{s.icon}</div>
<div className="card-label">{s.label}</div>
<div className="card-desc">{s.description}</div>
<div className="card-who" style={{color:s.aiStarts?C.success:C.accent}}>{s.aiStarts?“🤖 AI opens”:“👤 You open”}</div>
</div>
);})}
</div>
<div className="section-label">How should I coach you?</div>
<div className="style-row">
{COACHING_STYLES.map(s=>{const sel=coachStyle===s.id;return(
<div key={s.id} className=“style-chip” onClick={()=>setCoachStyle(s.id)}
style={{background:sel?C.accentSoft:”#13131a”,border:`1.5px solid ${sel?C.accent:"#2a2a3a"}`}}>
<div className="style-chip-label" style={{color:sel?C.accent:C.text}}>{s.label}</div>
<div className="style-chip-desc">{s.description}</div>
</div>
);})}
</div>
<button className=“start-btn” disabled={!scenario||!coachStyle} onClick={startSession}
style={{background:(!scenario||!coachStyle)?”#2a2a3a”:`linear-gradient(135deg,${currentCategory?.color||C.accent},${C.accent})`,opacity:(!scenario||!coachStyle)?0.4:1,boxShadow:`0 4px 24px ${C.accentGlow}`}}>
Start Session →
</button>
</div>
</div>
);

return(
<div className="app" style={{padding:0}}>
<div className="glow"/>
<div className=“wrap” style={{display:“flex”,flexDirection:“column”,height:“100vh”,padding:“0 16px”}}>
<div className="chat-header">
<div style={{display:“flex”,alignItems:“center”,gap:10}}>
<div className="chat-icon">{selectedScenario?.icon}</div>
<div>
<div className="chat-title">{selectedScenario?.label}</div>
<div className="chat-style">{selectedStyle?.label} · {selectedStyle?.description}</div>
</div>
</div>
<div className="header-btns">
{ttsSupported&&(
<button className=“voice-btn” onClick={()=>{setVoiceEnabled(v=>!v);if(speaking)stopSpeaking();}}
style={{border:`1px solid ${voiceEnabled?C.accent:"#2a2a3a"}`,background:voiceEnabled?C.accentSoft:“transparent”,color:voiceEnabled?C.accent:”#7878a0”}}>
<span style={{animation:speaking&&voiceEnabled?“speakPulse .8s ease-in-out infinite”:“none”}}>{voiceEnabled?“🔊”:“🔇”}</span>
{voiceEnabled?“Voice On”:“Voice Off”}
</button>
)}
{speaking&&<button className="stop-btn" onClick={stopSpeaking}>■ Stop</button>}
<button className="reset-btn" onClick={reset}>← New</button>
<button className=“reset-btn” onClick={()=>{if(confirm(“Change API key?”)){clearKey();setApiKey(””);setScreen(“apikey”);}}}>🔑</button>
</div>
</div>
<div className="messages">
{messages.length===0&&(
<div className="empty-state">
<div style={{fontSize:40}}>{selectedScenario?.icon}</div>
{!selectedScenario?.aiStarts&&selectedScenario?.yourTurn?(
<div className="your-turn-box">
<div className="your-turn-label">✦ Your turn to open</div>
<div className="your-turn-text">{selectedScenario.yourTurn}</div>
<div className="your-turn-hint">{voiceSupported?“Tap 🎤 to speak or type below.”:“Type your opening line below.”}</div>
</div>
):(
<div style={{fontSize:14,color:C.textMuted,opacity:.5}}>Starting the scene…</div>
)}
</div>
)}
{messages.map((msg,i)=>{
const isCoach=msg.role===“assistant”&&isCoachMsg(msg.content);
if(isCoach)return(<div key={i} className="coach-msg"><div className="coach-bubble"><div className="coach-label">✦ Coach Feedback</div>{msg.content}</div></div>);
const isUser=msg.role===“user”;
return(
<div key={i} className=“msg-row” style={{justifyContent:isUser?“flex-end”:“flex-start”}}>
{!isUser&&<div className=“avatar” style={{background:C.surface,border:`1px solid ${C.border}`,color:C.textMuted}}>AI</div>}
<div className=“bubble” style={{background:isUser?C.accent:C.surface,border:`1px solid ${isUser?"transparent":C.border}`,borderRadius:isUser?“16px 16px 4px 16px”:“16px 16px 16px 4px”,color:isUser?”#fff”:C.text}}>{msg.content}</div>
{isUser&&<div className=“avatar” style={{background:C.accent,color:”#fff”}}>You</div>}
</div>
);
})}
{loading&&<TypingIndicator/>}
<div ref={messagesEndRef}/>
</div>
<div className="input-area">
{listening&&<div className="listening-indicator"><span style={{animation:“speakPulse .8s ease-in-out infinite”}}>●</span> Listening… speak now</div>}
{micError&&<div className="mic-error">⚠️ {micError}</div>}
<div className="input-row">
{voiceSupported&&(
<button className=“mic-btn” onClick={toggleListening} disabled={loading}
style={{background:listening?“rgba(248,113,113,.15)”:C.surface,border:`1.5px solid ${listening?C.danger:C.border}`,color:listening?C.danger:C.textMuted,cursor:loading?“not-allowed”:“pointer”}}>
{listening&&<>
<span style={{position:“absolute”,inset:-4,borderRadius:14,border:`1.5px solid ${C.danger}`,opacity:.4,animation:“micRing 1.2s ease-out infinite”}}/>
<span style={{position:“absolute”,inset:-8,borderRadius:18,border:`1px solid ${C.danger}`,opacity:.2,animation:“micRing 1.2s ease-out .3s infinite”}}/>
</>}
🎤
</button>
)}
<textarea className=“msg-input” ref={textareaRef}
placeholder={voiceSupported?“Type or tap 🎤 to speak…”:“Type your response… (Enter to send)”}
value={input} rows={1}
onChange={e=>{setInput(e.target.value);e.target.style.height=“auto”;e.target.style.height=Math.min(e.target.scrollHeight,140)+“px”;}}
onKeyDown={handleKeyDown}
/>
<button className=“send-btn” onClick={()=>sendMessage()} disabled={!input.trim()||loading}
style={{background:(!input.trim()||loading)?”#2a2a3a”:C.accent,color:(!input.trim()||loading)?”#4a4a6a”:”#fff”,cursor:(!input.trim()||loading)?“not-allowed”:“pointer”}}>↑</button>
</div>
</div>
</div>
</div>
);
}

ReactDOM.render(<App/>,document.getElementById(“root”));
</script>

</body>
</html>
